name: mathbot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: mathbot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      RUN_FOR_SECONDS: "3480"
      TZ: Europe/Kyiv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Залежності
        run: pip install -r requirements.txt

      - name: Запуск бота
        run: python bot.py

      - name: Зберегти стан (data.json)
        if: always()
        run: |
          if [ -f data.json ]; then
            git config user.name "mathbot"
            git config user.email "mathbot@users.noreply.github.com"
            git add -f data.json
            if ! git diff --cached --quiet; then
              git commit -m "state $(date -u +%FT%TZ)"
              git push
            fi
          fi
